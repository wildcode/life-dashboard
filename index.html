<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8">
  <div class="max-w-xl mx-auto" id="app">Loading...</div>
  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('app').innerHTML = `
          <header class="border-b border-slate-700 pb-4 mb-6">
            <h1 class="text-2xl font-bold">Execution Plan</h1>
            <p class="text-sm text-slate-400">Status: <span class="font-semibold uppercase text-emerald-400">${data.status}</span> | Updated: ${data.last_updated}</p>
          </header>
          <section class="space-y-4">
            <h2 class="text-lg font-semibold">Priorities</h2>
            <ul class="list-disc pl-5 space-y-1 text-slate-300">
              ${data.priorities.map(p => `<li>${p}</li>`).join('')}
            </ul>
          </section>
        `;
      });
  </script>
</body>
</html>
